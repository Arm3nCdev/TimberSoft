{% extends 'core/base.html' %}

{% block titulo %}Nuevo cliente{% endblock %}
{% block migas %}Clientes / <strong>Nuevo cliente</strong>{% endblock %}

{% block contenido %}
<div class="encabezado">
  <h1>Nuevo cliente</h1>
</div>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Guardar</button>
  <a class="btn" href="{% url 'core:clientes' %}">Cancelar</a>
</form>
{% endblock %}
